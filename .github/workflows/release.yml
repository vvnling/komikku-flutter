name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.0
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Pub get
        run: flutter pub get

      - name: Codegen (drift)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Decode signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > android/keystore.jks
          else
            echo "No keystore secret — release will fall back to debug signing."
          fi

      - name: Build APK
        run: flutter build apk --release
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Name artifact
        run: cp build/app/outputs/flutter-apk/app-release.apk build/comicko.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: comicko-apk
          path: build/comicko.apk

  web-linux:
    name: Build Web + Linux
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.0
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Codegen (drift)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build web
        run: |
          flutter build web --release
          dart compile js web/drift_worker.dart -o build/web/drift_worker.js -O4
          cd build/web && zip -r ../comicko-web.zip . && cd ../..

      - name: Build Linux
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends clang cmake ninja-build pkg-config libgtk-3-dev
          flutter build linux --release
          tar -C build/linux/x64/release/bundle -czf build/comicko-linux.tar.gz .

      - name: Upload web + linux
        uses: actions/upload-artifact@v4
        with:
          name: comicko-web-linux
          path: |
            build/comicko-web.zip
            build/comicko-linux.tar.gz

  windows:
    name: Build Windows
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.0
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Codegen (drift)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build Windows
        shell: pwsh
        run: |
          flutter build windows --release
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath build/comicko-windows.zip -Force

      - name: Upload windows
        uses: actions/upload-artifact@v4
        with:
          name: comicko-windows
          path: build/comicko-windows.zip

  release:
    name: Publish ${{ github.ref_name }}
    needs: [android, web-linux, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -la artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Comicko ${{ github.ref_name }}
          body: |
            ## Comicko ${{ github.ref_name }}

            Komikku, rewritten in Flutter — a free, open-source manga reader
            with a hand-crafted design system (no Material/Cupertino).

            ### Assets
            - `comicko.apk` — Android (universal APK)
            - `comicko-web.zip` — Web build (serve statically)
            - `comicko-linux.tar.gz` — Linux desktop bundle
            - `comicko-windows.zip` — Windows desktop build

            ### Notes
            - iOS/macOS builds are produced locally with Xcode
              (`flutter build ios|macos --release`).
            - Android releases are signed with the repository's release
              keystore (secrets `KEYSTORE_B64` etc.).
          files: artifacts/**
          fail_on_unmatched_files: false
          generate_release_notes: true
name: comicko
description: "Komikku, rewritten in Flutter — a free, open-source manga reader with a hand-crafted design system."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  drift: ^2.34.0
  drift_flutter: ^0.3.1
  path: ^1.9.0
  path_provider: ^2.1.4
  dio: ^5.11.0
  archive: ^3.6.1
  image: ^4.2.0
  crypto: ^3.0.5
  rive: ^0.14.11
  file_selector: ^1.0.3
  url_launcher: ^6.3.0
  share_plus: ^10.0.2
  shared_preferences: ^2.3.2
  collection: ^1.18.0
  intl: ^0.19.0

  web: any
dev_dependencies:
  flutter_test:
    sdk: flutter
  drift_dev: ^2.20.3
  build_runner: ^2.4.13
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  shaders:
    - shaders/aurora.frag
    - shaders/grain.frag
    - shaders/sheen.frag
    - shaders/ink.frag
    - shaders/wave.frag
    - shaders/reader_ambience.frag
    - shaders/speed_lines.frag
  assets:
    - assets/rive/
  fonts:
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk.ttf
